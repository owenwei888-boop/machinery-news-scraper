# Backfill AI summaries for already-published md items (empty aiSummary).
#
# The scrape workflow short-circuits enrichment when Gemini quota dies and
# never retries those items — this job heals the backlog in bounded batches.
# Trigger manually (Actions → Backfill AI → Run workflow). Repeat until the
# log line says "0 items lack summaries".
#
# Shares the scrape-publish concurrency group so backfill and scrape pushes
# to machinery-cf-site never overlap.

name: Backfill AI

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max items to enrich this run"
        required: false
        default: "300"
      rpm:
        description: "Gemini calls per minute"
        required: false
        default: "12"
  # Daily self-heal, kept PERMANENTLY: whenever AI dies mid-day (quota,
  # key revoked, billing) the scrape workflow publishes un-enriched items;
  # this job re-enriches them the next morning (~3 min no-op when dry).
  # Provider: DeepSeek V4.1-Flash (paid, ~¥0.003/item) since 2026-10-27 —
  # both Gemini free keys died (project ban + key revocation).
  schedule:
    - cron: '12 7 * * *'

permissions:
  contents: read

concurrency:
  group: scrape-publish
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SITE_REPO: https://github.com/owenwei888-boop/machinery-cf-site.git
      SITE_DIR: ./machinery-cf-site

    steps:
      - name: Checkout scraper
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Clone cf-site repo (deploy-key auth)
        # Same SSH deploy key as the scrape workflow (the old fine-grained
        # PAT died 2026-09-24; SITE_DEPLOY_KEY is repo-scoped and permanent).
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "ERROR: SITE_DEPLOY_KEY secret not set" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:owenwei888-boop/machinery-cf-site.git "$SITE_DIR"
          cd "$SITE_DIR"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Cloned cf-site @ $(git rev-parse --short HEAD)"

      - name: Run backfill
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backfill_md.py \
            --site-dir "$SITE_DIR" \
            --provider deepseek \
            --limit "${{ github.event.inputs.limit || '300' }}" \
            --rpm "${{ github.event.inputs.rpm || '12' }}"

      - name: Commit & push enriched items
        run: |
          cd "$SITE_DIR"
          git add src/content/news 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing enriched — no commit."
          else
            # Commit FIRST, then rebase — pull --rebase refuses to run with
            # a dirty index, and the scraper may have pushed while we
            # enriched. Scraper adds new files, backfill edits different
            # (empty-summary) ones, so the rebase never conflicts.
            N=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "chore(news): AI backfill $(date -u +%Y-%m-%dT%H:%M:%SZ) (+$N enriched)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Pushed $N enriched items. Cloudflare will rebuild shortly."
          fi
