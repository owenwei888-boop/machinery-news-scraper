# Machinery News Scraper → Cloudflare Pages (Git publisher, two-repo variant).
#
# Architecture:
#   - This repo (machinery-news-scraper) holds the scraper code.
#   - A SEPARATE repo (machinery-cf-site) holds the Astro site, deployed to CF.
#   - The scraper clones cf-site into the workspace, writes Markdown files
#     into src/content/news/, then commits + pushes back to cf-site.
#   - Cloudflare Pages watches machinery-cf-site → rebuilds automatically.
#
# Secret required:
#   SITE_DEPLOY_KEY — SSH private key; its public half is a write Deploy
#                    Key on owenwei888-boop/machinery-cf-site ("scraper-
#                    publish (GitHub Actions)"). Repo-scoped and never
#                    expires; replaces the fine-grained PAT that died on
#                    2026-09-24.

#
# Old WP-pushing workflow (scrape.yml) was deleted when this landed.

name: Scrape & Publish

on:
  schedule:
    # Every 6h at 07/13/19/01 UTC (off the :00 mark to spread load)
    - cron: '7 1,7,13,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: read   # scraper repo itself — we don't push back here

concurrency:
  group: scrape-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # The cf-site repo we clone + push Markdown back to
      SITE_REPO: https://github.com/owenwei888-boop/machinery-cf-site.git
      SITE_DIR: ./machinery-cf-site

    steps:
      - name: Checkout scraper
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Clone cf-site repo (deploy-key auth)
        # Repo-scoped SSH deploy key — no expiring PAT. Clones AND the
        # later git push both go over SSH with this key.
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "ERROR: SITE_DEPLOY_KEY secret not set" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s
' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:owenwei888-boop/machinery-cf-site.git "$SITE_DIR"
          cd "$SITE_DIR"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Cloned cf-site @ $(git rev-parse --short HEAD)"

      - name: Run scraper (publish to Git)
        env:
          PYTHONPATH: src
          MACHINERY_PUBLISHER: git
          MACHINERY_SITE_DIR: ${{ env.SITE_DIR }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Empty .env keeps the cli's (legacy) .env-existence guard happy;
          # with the cli patch the file is unused on the git path.
          touch .env
          python -m machinery_news_scraper run \
            --source all \
            --ai-provider gemini \
            --ai-model gemini-2.5-flash-lite \
            --auto-publish-threshold 3 \
            --ai-rpm 10

      - name: Prune to build window (keep Astro build bounded)
        # Keeps the newest 3000 items in src/content/news; moves the rest to
        # archive/news (still in git, excluded from the build). Without this
        # the collection grew to 13.6k files and every Workers Build after
        # 2026-08-24 failed. Node is preinstalled on ubuntu-latest.
        run: |
          cd "$SITE_DIR"
          node scripts/prune-news.mjs

      - name: Commit & push new items
        run: |
          cd "$SITE_DIR"
          # -A sweeps both the new items and the prune moves (news -> archive).
          # dist/ and node_modules/ are gitignored, so nothing else leaks in.
          git add -A
          if git diff --cached --quiet; then
            echo "No new items this run — nothing to commit."
          else
            N=$(git diff --cached --name-only --diff-filter=A -- src/content/news | wc -l | tr -d ' ')
            git commit -m "chore(news): auto-scrape $(date -u +%Y-%m-%dT%H:%M:%SZ) (+$N items)"
            git push origin HEAD:main
            echo "Pushed $N new items. Cloudflare will rebuild shortly."
          fi
