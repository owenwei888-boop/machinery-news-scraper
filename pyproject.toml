[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machinery-news-scraper"
version = "0.1.0"
description = "RSS aggregator scraper for the-packing-machine.com"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
machinery-news-scraper = "machinery_news_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/machinery_news_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
