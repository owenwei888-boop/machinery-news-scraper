# 30 verified-working sources (probed 2026-06-26).
# Google News RSS queries return 100 items each, covering thousands of publications.
# Note: name values with colons must be quoted (YAML rule).
sources:
  # --- Original 8 (direct + Feedburner) ---
  - id: packaging-digest
    name: "Packaging Digest"
    url: https://feeds.feedburner.com/PackagingDigest
    source_type: rss

  - id: packaging-strategies
    name: "Packaging Strategies"
    url: https://feeds.feedburner.com/PackagingStrategies
    source_type: rss

  - id: flexible-packaging
    name: "Flexible Packaging"
    url: https://feeds.feedburner.com/FlexiblePackaging
    source_type: rss

  - id: food-engineering
    name: "Food Engineering"
    url: https://feeds.feedburner.com/FoodEngineering
    source_type: rss

  - id: industrial-machinery-news
    name: "Industrial Machinery News"
    url: https://industrialmachinerynews.com/feed/
    source_type: rss

  - id: plastics-today
    name: "Plastics Today"
    url: https://www.plasticstoday.com/rss.xml
    source_type: rss

  - id: modern-materials-handling
    name: "Modern Materials Handling"
    url: https://www.mmh.com/feed/
    source_type: rss

  - id: robot-report
    name: "The Robot Report"
    url: https://www.therobotreport.com/feed/
    source_type: rss

  # --- Robotics + tech (direct, working) ---
  - id: robotics-business-review
    name: "Robotics Business Review"
    url: https://www.roboticsbusinessreview.com/feed/
    source_type: rss

  - id: ieee-spectrum
    name: "IEEE Spectrum (Robotics + AI)"
    url: https://spectrum.ieee.org/feeds/feed.rss
    source_type: rss

  # --- Google News RSS aggregators (100 items each, covers 1000s of pubs) ---
  - id: gnews-packaging-machinery
    name: "Google News: packaging machinery"
    url: https://news.google.com/rss/search?q=packaging+machinery+OR+vffs+OR+%22form+fill+seal%22&hl=en&gl=US&ceid=US:en
    source_type: rss

  - id: gnews-pouch-packaging
    name: "Google News: pouch packaging"
    url: https://news.google.com/rss/search?q=pouch+packaging+OR+flexible+packaging&hl=en&gl=US&ceid=US:en
